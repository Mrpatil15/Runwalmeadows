services:
  - type: web
    name: runwal-meadows
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: LEAD_EMAIL
        value: heawen@runwalmeadows.info
      - key: ADMIN_KEY
        value: heawen2024
      - key: FROM_NAME
        value: Runwal Meadows – Heawen Property
